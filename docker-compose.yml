services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flowoffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Bind mount: live app code for hot reload. Overwrites /var/www/html including vendor/.
      - ./apps/backend:/var/www/html
      # Named volume overlay: mounts ON TOP of the bind mount at the vendor/ subdirectory,
      # restoring the vendor/ that was baked into the image at build time.
      # On first start Docker auto-seeds this volume from the image layer (one-time only).
      # Subsequent restarts reuse the persisted volume — no composer dump-autoload needed.
      # To reset (e.g. after adding a package): docker volume rm flowoffice_backend_vendor
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./apps/backend/.env.dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./apps/frontend:/app
      # Same named volume overlay pattern as backend_vendor:
      # node_modules baked into image layer, preserved across restarts.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
      - pnpm_store:/root/.local/share/pnpm/store
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install --no-frozen-lockfile && cp .env.dev .env.local && pnpm dev"
    depends_on:
      backend:
        condition: service_healthy

  queue:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.dev
    volumes:
      # Same vendor overlay as backend service — shares the same named volume.
      - ./apps/backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    env_file:
      - ./apps/backend/.env
    command: sh -c "php artisan queue:work --sleep=3 --tries=3"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  frontend_node_modules:
  frontend_next:
  pnpm_store:
  backend_vendor:
