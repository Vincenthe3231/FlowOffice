; FlowOffice PHP overrides (loaded via conf.d in Dockerfile.dev).
; Default upload_max_filesize=2M rejects face/avatar photos — the app allows 5M
; (client useProfile.ts + Laravel max:5120). Raise PHP limits above 5M with headroom.
; post_max_size MUST stay > upload_max_filesize to cover multipart overhead.
upload_max_filesize = 10M
post_max_size = 12M
memory_limit = 256M
